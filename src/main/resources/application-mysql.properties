# ---- MySQL profile ----
# Switch to this profile once you have a MySQL instance available:
#   mvn spring-boot:run -Dspring-boot.run.profiles=mysql
#
# All values below can be overridden with environment variables,
# which is exactly what you'll wire up later in Docker/Kubernetes
# (e.g. DB_URL, DB_USERNAME, DB_PASSWORD as env vars or secrets).

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/emsdb?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

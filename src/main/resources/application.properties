# =========================================================
# Employee Management System - Application Configuration
# =========================================================

spring.application.name=employee-management-system

# Active profile: 'dev' (H2, default) or 'mysql'
spring.profiles.active=dev

server.port=8080

# ---- JSON ----
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

# ---- Actuator ----
# Exposed now for local use; also what a future Docker HEALTHCHECK
# or Kubernetes liveness/readiness probe would call.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
